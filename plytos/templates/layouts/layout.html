<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <title>Plytos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    
    <!-- Bootstrap 3.3.2 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/slick.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='js/rs-plugin/css/settings.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <script type="text/javascript" src="{{ url_for('static', filename='js/modernizr.custom.32033.js') }}"></script>
</head>

<body>
    <header>  
            <nav class="navbar navbar-default scrolled" role="navigation">
                <div class="container">
                    <!-- Brand and toggle get grouped for better mobile display -->
                    <div class="navbar-header">
                        <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1">
                            <span class="fa fa-bars fa-lg"></span>
                        </button>
                    </div>

                    <!-- Collect the nav links, forms, and other content for toggling -->
                    <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">

                        <ul class="nav navbar-nav navbar-right">
                            <li><a href="/user/logout">Logout</a></li> 
                            <li><a href="/user/profile">Profile</a></li> 

                            <li><a href="/resumes/edit">Create</a></li>
                            <li><a href="/resumes/revise">Edit</a></li>
                            <li><a href="/resumes/history">History</a></li>
                            <li><a href="/resumes/review">Review</a></li> 
                            <li><a href="/resumes/final">Published</a></li>

                            <li><a href="/jobs/">Jobs</a></li>
                        </ul>
                    </div>
                        <!-- /.navbar-collapse -->
                </div>
                    <!-- /.container-->
            </nav>

    </header>

    <div class="wrapper">
        {% block body %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/jquery-1.11.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/slick.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/placeholdem.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/rs-plugin/js/jquery.themepunch.plugins.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/rs-plugin/js/jquery.themepunch.revolution.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/waypoints.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/scripts_layout.js') }}"></script>
    <script>
        $(document).ready(function() {
            appMaster.preLoader();
        });
    </script>
</body>

</html>
