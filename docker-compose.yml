# Local Postgres for development and tests: docker compose up -d db
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # The Postgres 18 image keeps its data under /var/lib/postgresql/18, so
      # the volume mounts one level up. A new volume name keeps an old
      # Postgres 16 volume from being reused.
      - pgdata18:/var/lib/postgresql

volumes:
  pgdata18: {}
