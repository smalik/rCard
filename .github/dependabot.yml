version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/services/api", "/apps/web"]
    schedule:
      interval: weekly
