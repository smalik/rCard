[project]
name = "plytos-api"
version = "0.1.0"
description = "Plytos API: cards, versions and variants"
requires-python = ">=3.13"
dependencies = [
  "cryptography>=44",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.32",
  "python-docx>=1.2.0",
  "pdfplumber>=0.11.10",
  "anthropic>=2.4",
]

[project.optional-dependencies]
gcp = ["google-cloud-kms>=3", "anthropic[vertex]>=2.4"]

[dependency-groups]
dev = [
  "fpdf2>=2.9.0",
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plytos_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "RUF001"]
# Resumes are full of typographic dashes, quotes and bullets; matching them is the job.
"src/plytos_api/imports/**" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["plytos_api"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["google.cloud.*", "lxml", "lxml.*"]
ignore_missing_imports = true
